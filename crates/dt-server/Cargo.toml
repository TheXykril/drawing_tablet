[package]
name = "dt-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Drawing tablet streaming server"

[[bin]]
name = "dt-server"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dt-protocol = { workspace = true }
dt-input = { workspace = true }
dt-capture = { workspace = true }
dt-encoder = { workspace = true }
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
image = { version = "0.24", default-features = false, features = ["png"] }
chrono = "0.4.43"
serde_json = "1"
